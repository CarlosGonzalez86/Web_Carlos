<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Página Web - Proceso de Planilla</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0d47a1, #64b5f6); /* azul a celeste */
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 40px;
    }
    h1 {
      margin: 0;
      font-size: 2.5em;
    }
    h2 {
      margin-top: 10px;
      font-weight: normal;
    }
    .upload-section {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      margin: 40px auto;
      width: 60%;
      border-radius: 10px;
    }
    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      background-color: #1976d2;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover {
      background-color: #0d47a1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bienvenidos a la Página Web</h1>
    <h2>Licdo. Carlos González</h2>
    <p>Proceso de Planilla de Horas Extras</p>
  </header>

  <section class="upload-section">
    <p>Desde aquí podrás subir tus documentos para el proceso de planilla.</p>
    <input type="file" id="fileInput" accept=".pdf,image/*" multiple>
    <br>
    <button onclick="uploadFile()">Subir a Google Drive</button>
  </section>

  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    // Configuración de la API de Google Drive
    const CLIENT_ID = "TU_CLIENT_ID.apps.googleusercontent.com"; 
    const API_KEY = "TU_API_KEY"; 
    const SCOPES = "https://www.googleapis.com/auth/drive.file";

    function authenticate() {
      return gapi.auth2.getAuthInstance()
        .signIn({scope: SCOPES})
        .then(() => console.log("Autenticado correctamente"),
              err => console.error("Error de autenticación", err));
    }

    function loadClient() {
      gapi.client.setApiKey(API_KEY);
      return gapi.client.load("https://www.googleapis.com/discovery/v1/apis/drive/v3/rest")
        .then(() => console.log("Cliente cargado correctamente"),
              err => console.error("Error al cargar cliente", err));
    }

    gapi.load("client:auth2", () => {
      gapi.auth2.init({client_id: CLIENT_ID});
    });

    function uploadFile() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) {
        alert("Por favor selecciona un archivo");
        return;
      }

      const metadata = {
        name: file.name,
        mimeType: file.type
      };

      const accessToken = gapi.auth.getToken().access_token;
      const form = new FormData();
      form.append("metadata", new Blob([JSON.stringify(metadata)], {type: "application/json"}));
      form.append("file", file);

      fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: new Headers({"Authorization": "Bearer " + accessToken}),
        body: form
      }).then(res => res.json())
        .then(val => {
          alert("Archivo subido correctamente a Google Drive");
          console.log(val);
        });
    }
  </script>
</body>
</html>
