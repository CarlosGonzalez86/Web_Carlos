<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Horas Extras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f0f4f8 100%);
            color: #111;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark {
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
            color: #f3f4f6;
        }

        h1, h3, p, label, #resultado, .glass-btn, .result-footer {
            text-align: center;
        }

        h1 {
            color: #2563eb;
            transition: color 0.3s ease;
        }

        body.dark h1 {
            color: #f3f4f6;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            backdrop-filter: blur(5px);
            border-radius: 1rem;
            color: #111;
            transition: all 0.3s ease;
        }

        body.dark .glass {
            background: rgba(36, 37, 46, 0.93);
            box-shadow: 0 8px 32px 0 rgba(20, 20, 30, 0.35);
            color: #f3f4f6;
        }

        label {
            color: #2563eb;
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
            transition: color 0.3s ease;
        }

        body.dark label {
            color: #93c5fd;
        }

        input {
            background: #fff;
            color: #111;
            text-align: center;
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #93c5fd;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        body.dark input {
            background: #18181b;
            color: #f3f4f6;
            border-color: #475569;
        }

        body.dark input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        button {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 0.8rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(90deg, #1e40af, #3730a3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        #resultado {
            margin-top: 1.5rem;
            background-color: #e0f2fe;
            padding: 1.5rem;
            border-radius: 1rem;
            border-left: 6px solid #2563eb;
            box-shadow: 0 4px 6px rgba(31, 38, 135, 0.07);
            color: #0c4a6e;
            animation: slideIn 0.3s ease;
            transition: all 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body.dark #resultado {
            background-color: #1e293b;
            border-left-color: #60a5fa;
            color: #93c5fd;
        }

        #resultado p {
            margin: 0.5rem 0;
            font-size: 1.05rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.65);
            border: 2px solid #2563eb;
            color: #2563eb;
            font-weight: bold;
            padding: 0.7rem 1.6rem;
            border-radius: 0.8rem;
            box-shadow: 0 4px 20px 0 rgba(31, 38, 135, 0.09);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            justify-content: center;
        }

        .glass-btn:hover {
            background: #2563eb;
            color: #fff;
            border-color: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        .glass-btn:active {
            transform: translateY(0);
        }

        .glass-btn svg {
            width: 20px;
            height: 20px;
        }

        body.dark .glass-btn {
            background: rgba(96, 165, 250, 0.15);
            border-color: #60a5fa;
            color: #60a5fa;
        }

        body.dark .glass-btn:hover {
            background: #60a5fa;
            color: #1e293b;
            border-color: #93c5fd;
        }

        @media (max-width: 520px) {
            .action-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }
            .glass-btn {
                width: 100%;
            }
        }

        .result-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            margin-top: 2rem;
            text-align: center;
        }

        .result-footer img {
            height: 40px;
            width: auto;
            border-radius: 0.5rem;
        }

        .result-footer p {
            font-size: 0.95rem;
            color: #2563eb;
            margin: 0;
            transition: color 0.3s ease;
        }

        body.dark .result-footer p {
            color: #93c5fd;
        }

        footer {
            background: #fff;
            color: #2563eb;
            border-top: 2px solid #2563eb;
            box-shadow: 0 4px 10px rgba(31, 38, 135, 0.07);
            text-align: center;
            transition: all 0.3s ease;
        }

        body.dark footer {
            background: #18181b;
            color: #f3f4f6;
            border-top-color: #93c5fd;
        }

        footer img {
            width: 36px;
            margin-bottom: 8px;
            border-radius: 0.3rem;
        }

        footer p {
            margin: 0;
            font-size: 0.95rem;
        }

        #darkModeToggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 50;
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #2563eb;
            border-radius: 50%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #darkModeToggle:hover {
            background: #e0e7ff;
            transform: scale(1.1);
        }

        body.dark #darkModeToggle {
            background: rgba(36, 37, 46, 0.93);
            border-color: #60a5fa;
        }

        body.dark #darkModeToggle:hover {
            background: #18181b;
        }

        #darkModeIcon {
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #darkModeToggle:active #darkModeIcon {
            transform: rotate(40deg) scale(1.1);
        }

        nav ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        nav ul li {
            display: inline-block;
            margin-right: 20px;
        }

        nav ul li a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            padding-bottom: 2px;
            border-bottom: 2px solid transparent;
        }

        body.dark nav ul li a {
            color: #93c5fd;
        }

        nav ul li a:hover {
            border-bottom-color: #2563eb;
        }

        body.dark nav ul li a:hover {
            border-bottom-color: #93c5fd;
        }

        header {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">

    <!-- Header y navegación -->
    <header class="w-full bg-white/80 dark:bg-gray-900/80 backdrop-blur border-b border-blue-200 dark:border-gray-700 py-4 shadow-md mb-6">
        <nav class="flex justify-center">
            <ul>
                <li><a href="CalViatico.HTML">Cálculo Décimo</a></li>
            </ul>
        </nav>
    </header>

    <!-- Calculadora Horas Extras principal -->
    <div class="glass w-full max-w-xl mx-auto p-8 mb-8">
        <div class="flex justify-center items-center my-6">
            <img src="Imagenes/Screenshot_20260813_220411_com_microsoft_copilot_MainActivity.jpg" alt="Logo" class="h-20 w-auto" />
        </div>
        <h1 class="text-4xl font-extrabold text-center drop-shadow mb-6 tracking-tight">
            Calculadora de Horas Extras
        </h1>
        <form id="formulario">
            <div class="mb-6">
                <label for="horas">Horas trabajadas:</label>
                <input type="number" id="horas" placeholder="Ingrese las horas" min="0" step="0.5" required>
            </div>
            <div class="mb-6">
                <label for="tarifa">Tarifa por hora ($):</label>
                <input type="number" id="tarifa" placeholder="Ingrese la tarifa" min="0" step="0.01" required>
            </div>
            <div id="resultado"></div>
        </form>
        <!-- Botones PDF y Compartir -->
        <div class="action-buttons">
            <button class="glass-btn" onclick="descargarPDF()" type="button" title="Descargar resultado como PDF">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke="currentColor" stroke-width="2" d="M12 16v-8m0 8l-4-4m4 4l4-4M4 18h16"/>
                </svg>
                Descargar PDF
            </button>
            <button class="glass-btn" onclick="compartirWhatsApp(event)" type="button" title="Compartir por WhatsApp">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 32 32">
                    <path d="M16 3C9.383 3 4 8.383 4 15c0 2.633.92 5.071 2.583 7.071L4 29l7.114-2.431C13.051 27.15 14.497 27.5 16 27.5c6.617 0 12-5.383 12-12S22.617 3 16 3zm0 22.5c-1.326 0-2.626-.252-3.88-.74l-.28-.09-2.9.99.99-2.9-.09-.28C5.58 18.626 5.25 17.4 5.25 15c0-6.068 4.932-11 11-11s11 4.932 11 11-4.932 11-11 11z"/>
                </svg>
                Compartir por WhatsApp
            </button>
        </div>
        <!-- Logo y copyright debajo del resultado -->
        <div class="result-footer">
            <img src="Imagenes/Screenshot_20260813_220411_com_microsoft_copilot_MainActivity.jpg" alt="Logo">
            <p>© Creado por Licdo. Carlos E. González</p>
        </div>
    </div>

    <!-- Botón flotante modo oscuro -->
    <div id="darkModeToggle" title="Cambiar modo claro/oscuro" onclick="cambiarModo()">
        <span id="darkModeIcon">
            <svg id="iconSunMoon" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-yellow-400 dark:text-yellow-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <g id="iconSun">
                    <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2" fill="currentColor"/>
                    <g stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="2" x2="12" y2="4"/>
                        <line x1="12" y1="20" x2="12" y2="22"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="2" y1="12" x2="4" y2="12"/>
                        <line x1="20" y1="12" x2="22" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </g>
                </g>
                <g id="iconMoon" style="display:none;">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/>
                </g>
            </svg>
        </span>
    </div>

    <footer class="w-full bg-white/80 dark:bg-gray-900/80 backdrop-blur border-t border-blue-200 dark:border-gray-700 shadow-lg py-4 flex flex-col md:flex-row items-center justify-center gap-4 mt-auto">
        <img src="Imagenes/Screenshot_20260813_220411_com_microsoft_copilot_MainActivity.jpg" alt="Logo" class="h-8 w-auto mx-2">
        <p class="text-blue-900 dark:text-gray-300 text-sm md:text-base text-center">© Creado por Licdo. Carlos E. Gonzalez C.</p>
    </footer>

    <script>
        // Variables globales para evitar recálculos
        let cacheResultados = null;

        // Constante de deducción
        const PORCENTAJE_DEDUCCION = 0.142465;

        // Calcular en tiempo real con debounce
        let calcularTimeout;
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                clearTimeout(calcularTimeout);
                calcularTimeout = setTimeout(calcular, 300);
            });
        });

        function obtenerValores() {
            const horas = parseFloat(document.getElementById('horas').value) || 0;
            const tarifa = parseFloat(document.getElementById('tarifa').value) || 0;
            return { horas, tarifa };
        }

        function calcularResultados(horas, tarifa) {
            const total = horas * tarifa;
            const deduccion = total * PORCENTAJE_DEDUCCION;
            const totalConDeduccion = total - deduccion;

            return { total, deduccion, totalConDeduccion };
        }

        function calcular() {
            const { horas, tarifa } = obtenerValores();
            
            if (horas === 0 || tarifa === 0) {
                document.getElementById('resultado').innerHTML = '';
                return;
            }

            const resultados = calcularResultados(horas, tarifa);
            cacheResultados = resultados;

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = `
                <h3 class="text-xl font-bold text-blue-900 dark:text-blue-300 mb-4">Resultado</h3>
                <div style="text-align: left; display: inline-block;">
                    <p><strong>Horas:</strong> ${horas.toFixed(2)}</p>
                    <p><strong>Tarifa/Hora:</strong> $${tarifa.toFixed(2)}</p>
                    <hr style="border: none; border-top: 1px solid rgba(37, 99, 235, 0.3); margin: 0.5rem 0;">
                    <p style="font-size: 1.1rem;"><strong>Total a pagar:</strong> $${resultados.total.toFixed(2)}</p>
                    <p><strong>Descuento (14.2465%):</strong> -$${resultados.deduccion.toFixed(2)}</p>
                    <hr style="border: none; border-top: 1px solid rgba(37, 99, 235, 0.3); margin: 0.5rem 0;">
                    <p style="font-size: 1.15rem; font-weight: bold; color: #059669;"><strong>Neto a recibir:</strong> $${resultados.totalConDeduccion.toFixed(2)}</p>
                </div>
            `;
        }

        function descargarPDF() {
            const resultadoDiv = document.getElementById('resultado');
            if (!resultadoDiv.innerHTML.trim()) {
                alert("Calcula el resultado antes de descargar el PDF.");
                return;
            }

            const { horas, tarifa } = obtenerValores();
            const resultados = calcularResultados(horas, tarifa);

            const doc = new jspdf.jsPDF();
            let y = 20;

            doc.setFont("Inter", "bold");
            doc.setFontSize(18);
            doc.setTextColor(37, 99, 235);
            doc.text("CÁLCULO DE HORAS EXTRAS", 105, y, { align: "center" });
            y += 15;

            doc.setFontSize(11);
            doc.setTextColor(0, 0, 0);
            doc.setFont("Inter", "normal");

            const detalles = [
                ["Horas trabajadas:", `${horas.toFixed(2)} hrs`],
                ["Tarifa por hora:", `$${tarifa.toFixed(2)}`],
                ["", ""],
                ["Total a pagar:", `$${resultados.total.toFixed(2)}`],
                ["Descuento (14.2465%):", `-$${resultados.deduccion.toFixed(2)}`],
                ["", ""],
                ["NETO A RECIBIR:", `$${resultados.totalConDeduccion.toFixed(2)}`]
            ];

            detalles.forEach((detalle, index) => {
                if (detalle[0] === "") {
                    doc.setDrawColor(37, 99, 235);
                    doc.line(20, y, 190, y);
                } else {
                    if (detalle[0] === "NETO A RECIBIR:") {
                        doc.setFont("Inter", "bold");
                        doc.setFontSize(12);
                        doc.setTextColor(5, 150, 105);
                    }
                    doc.text(detalle[0], 20, y);
                    doc.text(detalle[1], 190, y, { align: "right" });
                    doc.setFont("Inter", "normal");
                    doc.setFontSize(11);
                    doc.setTextColor(0, 0, 0);
                }
                y += 8;
            });

            y += 10;
            doc.setFontSize(10);
            doc.setTextColor(37, 99, 235);
            doc.text("© Creado por Licdo. Carlos E. González", 105, y, { align: "center" });

            const fecha = new Date().toLocaleDateString('es-ES');
            y += 8;
            doc.text(`Generado: ${fecha}`, 105, y, { align: "center" });

            doc.save(`horas_extras_${fecha.replace(/\//g, '-')}.pdf`);
        }

        function compartirWhatsApp(event) {
            event.preventDefault();
            const resultadoDiv = document.getElementById('resultado');
            if (!resultadoDiv.innerHTML.trim()) {
                alert("Calcula el resultado antes de compartir.");
                return;
            }

            const { horas, tarifa } = obtenerValores();
            const resultados = calcularResultados(horas, tarifa);
            const fecha = new Date().toLocaleDateString('es-ES');

            let texto = "📊 *CÁLCULO DE HORAS EXTRAS*\n\n";
            texto += `📅 Fecha: ${fecha}\n`;
            texto += `⏰ Horas: ${horas.toFixed(2)}\n`;
            texto += `💰 Tarifa: $${tarifa.toFixed(2)}/hr\n\n`;
            texto += `💵 *Total a pagar:* $${resultados.total.toFixed(2)}\n`;
            texto += `📉 *Descuento:* $${resultados.deduccion.toFixed(2)}\n`;
            texto += `✅ *Neto a recibir:* $${resultados.totalConDeduccion.toFixed(2)}\n\n`;
            texto += `🔗 ${window.location.href}\n`;
            texto += `\n© Creado por Licdo. Carlos E. González`;

            const waUrl = "https://wa.me/?text=" + encodeURIComponent(texto);
            window.open(waUrl, "_blank");
        }

        function cambiarModo() {
            const body = document.body;
            body.classList.toggle("dark");
            updateIcon();
            localStorage.setItem("modo-oscuro", body.classList.contains("dark"));
        }

        function updateIcon() {
            const isDark = document.body.classList.contains("dark");
            const sun = document.querySelector('#iconSun');
            const moon = document.querySelector('#iconMoon');
            if (isDark) {
                sun.style.display = 'none';
                moon.style.display = 'block';
            } else {
                sun.style.display = 'block';
                moon.style.display = 'none';
            }
        }

        // Restaurar preferencia del modo oscuro al cargar
        document.addEventListener("DOMContentLoaded", function () {
            const isDarkMode = localStorage.getItem("modo-oscuro") === "true";
            if (isDarkMode) {
                document.body.classList.add("dark");
            }
            updateIcon();
        });
    </script>
</body>
</html>
