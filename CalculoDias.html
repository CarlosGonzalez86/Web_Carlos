<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de Díaz Pro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    linear-gradient(
    135deg,
    #ffffff,
    #ffffff,
    #0f172a);

    overflow-x:hidden;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:rgba(255,255,255,.04);
    border-radius:50%;
    top:-200px;
    right:-200px;
    animation:flotar 8s infinite ease-in-out;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255,255,255,.03);
    border-radius:50%;
    bottom:-150px;
    left:-100px;
    animation:flotar 10s infinite ease-in-out;
}

@keyframes flotar{
    50%{
        transform:translateY(30px);
    }
}

.container{
    width:100%;
    max-width:700px;

    padding:35px;

    border-radius:25px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:0 15px 30px rgba(0,0,0,.25);

    z-index:1;

    animation:entrada .8s ease;
}

@keyframes entrada{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* LOGO */

.logo-container{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:25px;
}

.logo-ring{
    position:relative;
    width:140px;
    height:140px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-ring::before{
    content:"";

    position:absolute;

    width:140px;
    height:140px;

    border-radius:50%;

    background:
    conic-gradient(
        #ff0000,
        #ff7b00,
        #ffff00,
        #00ff00,
        #00ffff,
        #0066ff,
        #8a2be2,
        #ff1493,
        #ff0000
    );

    animation:
        girarLogo 4s linear infinite,
        rainbow 8s linear infinite;

    z-index:0;
}

.logo-ring::after{
    content:"";

    position:absolute;

    width:126px;
    height:126px;

    background:#0f172a;

    border-radius:50%;

    z-index:1;
}

.logo-ring img{
    position:relative;
    z-index:2;

    width:110px;
    height:110px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.25);

    transition:.4s;
}

.logo-ring:hover img{
    transform:scale(1.08);
}

@keyframes girarLogo{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes rainbow{

    from{
        filter:
            hue-rotate(0deg)
            blur(2px);
    }

    to{
        filter:
            hue-rotate(360deg)
            blur(2px);
    }
}

h1{
    color:white;
    text-align:center;
    margin-bottom:10px;
}

.subtitulo{
    text-align:center;
    color:#dbeafe;
    margin-bottom:25px;
}

label{
    display:block;
    color:white;
    font-weight:600;
    margin-top:15px;
}

input{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

.acciones{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.mini-btn{
    flex:1;

    padding:10px;

    border:none;

    border-radius:10px;

    color:white;

    background:#1e40af;

    cursor:pointer;

    transition:.3s;
}

.mini-btn:hover{
    background:#2563eb;
}

.btn-principal{
    width:100%;

    margin-top:25px;

    padding:15px;

    border:none;

    border-radius:12px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
    90deg,
    #00b2ff,
    #005cff);

    transition:.3s;
}

.btn-principal:hover{
    transform:translateY(-2px);
}

.resultado{
    display:none;
    margin-top:25px;
}

.card{
    background:white;

    border-left:5px solid #0057ff;

    border-radius:15px;

    padding:15px;

    margin-bottom:12px;
}

.card h3{
    color:#0057ff;
    margin-bottom:5px;
}

.card p{
    color:#374151;
    font-size:18px;
    font-weight:bold;
}

.resumen{
    background:
    linear-gradient(
    135deg,
    #0057ff,
    #00a2ff);

    color:white;
}

.resumen h3{
    color:white;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-top:15px;
    text-align:center;
}

.stats span{
    display:block;
    font-size:28px;
    font-weight:bold;
}

.timeline{
    width:100%;
    height:18px;
    border-radius:50px;
    overflow:hidden;
    background:#ced4da;
    margin-top:20px;
}

.progress{
    width:0%;
    height:100%;

    background:
    linear-gradient(
    90deg,
    #00b2ff,
    #004cff);

    transition:2s;
}

footer{
    text-align:center;
    margin-top:20px;
    color:#dbeafe;
    font-size:13px;
}

@media(max-width:600px){

    .stats{
        flex-direction:column;
        gap:15px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="logo-container">
        <div class="logo-ring">
            <img src="Imagenes/Screenshot_20260813_220411_com_microsoft_copilot_MainActivity.jpg" alt="Logo">
        </div>
    </div>

    <h1>📅 Contador de Días Pro</h1>

    <p class="subtitulo">
        Calcula fechas por días calendario
    </p>

    <label for="fechaInicio">Fecha de inicio</label>

    <input type="date" id="fechaInicio">

    <div class="acciones">
        <button class="mini-btn" onclick="ponerHoy()">Hoy</button>
        <button class="mini-btn" onclick="ponerManana()">Mañana</button>
        <button class="mini-btn" onclick="limpiarFormulario()">Limpiar</button>
    </div>

    <label for="dias">Periodo de Días a Cálcular</label>

    <input
        type="number"
        id="dias"
        min="1"
        placeholder="Ejemplo: 120">

    <button
        class="btn-principal"
        onclick="calcularVacaciones()">

        🚀 Calcular Días 

    </button>

    <div class="resultado" id="resultado">

        <div class="card">
            <h3>📅 Fecha de Inicio</h3>
            <p id="inicio"></p>
        </div>

        <div class="card">
            <h3>🏁 Fecha Final</h3>
            <p id="fin"></p>
        </div>

        <div class="card">
            <h3>✅ Total de Días</h3>
            <p id="total"></p>
        </div>

        <div class="card">
            <h3>📆 Años Involucrados</h3>
            <p id="anio"></p>
        </div>

        <div class="card resumen">

            <h3>📊 Resumen Ejecutivo</h3>

            <div class="stats">

                <div>
                    <span id="meses">0</span>
                    <small>Meses</small>
                </div>

                <div>
                    <span id="semanas">0</span>
                    <small>Semanas</small>
                </div>

                <div>
                    <span id="cruce">No</span>
                    <small>Cruza Año</small>
                </div>

            </div>

        </div>

        <div class="timeline">
            <div class="progress" id="progress"></div>
        </div>

    </div>

    <footer>
        Sistema compatible con años bisiestos • Versión PRO
    </footer>

</div>

<script>

window.onload = () => {
    ponerManana();
};

function ponerHoy(){

    let hoy = new Date();

    document.getElementById("fechaInicio").value =
    hoy.toISOString().split("T")[0];
}

function ponerManana(){

    let manana = new Date();

    manana.setDate(manana.getDate() + 1);

    document.getElementById("fechaInicio").value =
    manana.toISOString().split("T")[0];
}

function limpiarFormulario(){

    document.getElementById("fechaInicio").value = "";
    document.getElementById("dias").value = "";

    document.getElementById("resultado").style.display = "none";

    document.getElementById("progress").style.width = "0%";
}

function formatearFecha(fecha){

    return fecha.toLocaleDateString("es-ES",{

        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"

    });
}

function calcularVacaciones(){

    const fechaInput =
    document.getElementById("fechaInicio").value;

    const dias =
    parseInt(document.getElementById("dias").value);

    if(!fechaInput || !dias || dias <= 0){

        alert("Ingrese una fecha y una cantidad válida.");
        return;
    }

    const partes = fechaInput.split("-");

    let inicio = new Date(
        partes[0],
        partes[1] - 1,
        partes[2]
    );

    let fin = new Date(inicio);

    fin.setDate(fin.getDate() + dias - 1);

    document.getElementById("inicio").textContent =
    formatearFecha(inicio);

    document.getElementById("fin").textContent =
    formatearFecha(fin);

    document.getElementById("total").textContent =
    dias + " días calendario";

    let años = [];

    for(
        let a = inicio.getFullYear();
        a <= fin.getFullYear();
        a++
    ){
        años.push(a);
    }

    document.getElementById("anio").textContent =
    años.join(" - ");

    let meses = (dias / 30.44).toFixed(1);

    let semanas = Math.floor(dias / 7);

    document.getElementById("meses").textContent =
    meses;

    document.getElementById("semanas").textContent =
    semanas;

    document.getElementById("cruce").textContent =
    inicio.getFullYear() !== fin.getFullYear()
    ? "Sí"
    : "No";

    document.getElementById("resultado").style.display =
    "block";

    document.getElementById("progress").style.width =
    "0%";

    requestAnimationFrame(() => {
        document.getElementById("progress").style.width =
        "100%";
    });
}

/* RESPLANDOR RGB */

window.addEventListener("load", ()=>{

    const colores = [
        "#ff0000",
        "#ff7b00",
        "#ffff00",
        "#00ff00",
        "#00ffff",
        "#0066ff",
        "#8a2be2",
        "#ff1493"
    ];

    setInterval(()=>{

        const aro =
        document.querySelector(".logo-ring");

        const color =
        colores[Math.floor(Math.random()*colores.length)];

        aro.style.filter =
        `drop-shadow(0 0 15px ${color})
         drop-shadow(0 0 30px ${color})
         drop-shadow(0 0 50px ${color})`;

    },700);

});

</script>

</body>
</html>
