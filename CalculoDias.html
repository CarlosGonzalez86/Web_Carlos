<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Calculadora de Vacaciones Pro</title> <style> /* ================================ CONFIGURACIÓN GENERAL ================================ */ *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; } body{ min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; background: linear-gradient( 135deg, #001f54, #0048ff, #0f172a ); overflow-x:hidden; position:relative; } /* ================================ FONDOS ANIMADOS ================================ */ body::before{ content:""; position:fixed; width:600px; height:600px; background:rgba(255,255,255,.04); border-radius:50%; top:-200px; right:-200px; animation:flotar 8s infinite ease-in-out; pointer-events:none; } body::after{ content:""; position:fixed; width:400px; height:400px; background:rgba(255,255,255,.03); border-radius:50%; bottom:-150px; left:-100px; animation:flotar 10s infinite ease-in-out; pointer-events:none; } @keyframes flotar{ 50%{ transform:translateY(30px); } } /* ================================ CONTENEDOR PRINCIPAL ================================ */ .container{ width:100%; max-width:700px; padding:35px; border-radius:25px; background:rgba(255,255,255,.12); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.15); box-shadow: 0 15px 30px rgba(0,0,0,.25); position:relative; z-index:1; animation:entrada .8s ease; } @keyframes entrada{ from{ opacity:0; transform:translateY(40px); } to{ opacity:1; transform:translateY(0); } } /* ================================ LOGO ================================ */ .logo-container{ display:flex; justify-content:center; align-items:center; margin-bottom:25px; } .logo-ring{ position:relative; width:140px; height:140px; display:flex; justify-content:center; align-items:center; border-radius:50%; transition:.4s; } /* ARO RGB */ .logo-ring::before{ content:""; position:absolute; inset:0; border-radius:50%; background: conic-gradient( #ff0000, #ff7b00, #ffff00, #00ff00, #00ffff, #0066ff, #8a2be2, #ff1493, #ff0000 ); animation:girarLogo 4s linear infinite; z-index:0; } /* CENTRO OSCURO */ .logo-ring::after{ content:""; position:absolute; width:126px; height:126px; background:#0f172a; border-radius:50%; z-index:1; } /* IMAGEN */ .logo-ring img{ position:relative; z-index:2; width:110px; height:110px; object-fit:cover; border-radius:50%; border:3px solid rgba(255,255,255,.35); transition:.4s; } .logo-ring:hover img{ transform:scale(1.08); } @keyframes girarLogo{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } } /* ================================ TITULOS ================================ */ h1{ color:white; text-align:center; margin-bottom:10px; font-size:30px; } .subtitulo{ text-align:center; color:#dbeafe; margin-bottom:25px; font-size:15px; } /* ================================ FORMULARIO ================================ */ label{ display:block; color:white; font-weight:600; margin-top:15px; } input{ width:100%; padding:14px; margin-top:8px; border:none; border-radius:12px; font-size:16px; outline:none; background:white; color:#111827; transition:.3s; } input:focus{ box-shadow: 0 0 0 3px rgba(0,178,255,.35); } /* ================================ BOTONES PEQUEÑOS ================================ */ .acciones{ display:flex; gap:10px; margin-top:10px; } .mini-btn{ flex:1; padding:10px; border:none; border-radius:10px; color:white; background:#1e40af; cursor:pointer; transition:.3s; font-weight:600; } .mini-btn:hover{ background:#2563eb; transform:translateY(-2px); } /* ================================ BOTÓN PRINCIPAL ================================ */ .btn-principal{ width:100%; margin-top:25px; padding:15px; border:none; border-radius:12px; color:white; font-size:17px; font-weight:bold; cursor:pointer; background: linear-gradient( 90deg, #00b2ff, #005cff ); transition:.3s; box-shadow: 0 8px 20px rgba(0,92,255,.3); } .btn-principal:hover{ transform:translateY(-2px); box-shadow: 0 10px 25px rgba(0,92,255,.5); } /* ================================ RESULTADOS ================================ */ .resultado{ display:none; margin-top:25px; animation:mostrarResultado .5s ease; } @keyframes mostrarResultado{ from{ opacity:0; transform:translateY(15px); } to{ opacity:1; transform:translateY(0); } } /* ================================ TARJETAS ================================ */ .card{ background:white; border-left:5px solid #0057ff; border-radius:15px; padding:15px; margin-bottom:12px; box-shadow: 0 5px 15px rgba(0,0,0,.10); } .card h3{ color:#0057ff; margin-bottom:5px; font-size:16px; } .card p{ color:#374151; font-size:18px; font-weight:bold; } /* ================================ RESUMEN ================================ */ .resumen{ background: linear-gradient( 135deg, #0057ff, #00a2ff ); color:white; border-left:none; } .resumen h3{ color:white; } .stats{ display:flex; justify-content:space-around; margin-top:15px; text-align:center; } .stats div{ flex:1; } .stats span{ display:block; font-size:28px; font-weight:bold; } .stats small{ font-size:13px; } /* ================================ TIMELINE ================================ */ .timeline{ width:100%; height:18px; border-radius:50px; overflow:hidden; background:#ced4da; margin-top:20px; } .progress{ width:0%; height:100%; background: linear-gradient( 90deg, #00b2ff, #004cff ); transition:2s; } /* ================================ FOOTER ================================ */ footer{ text-align:center; margin-top:20px; color:#dbeafe; font-size:13px; } /* ================================ RESPONSIVE ================================ */ @media(max-width:600px){ body{ padding:10px; align-items:flex-start; } .container{ margin-top:10px; padding:22px 18px; border-radius:20px; } h1{ font-size:24px; } .subtitulo{ font-size:14px; } .logo-ring{ width:120px; height:120px; } .logo-ring::after{ width:108px; height:108px; } .logo-ring img{ width:94px; height:94px; } .acciones{ flex-direction:column; } .mini-btn{ width:100%; } .stats{ gap:15px; } } /* Pantallas muy pequeñas */ @media(max-width:380px){ .container{ padding:18px 14px; } h1{ font-size:21px; } .card p{ font-size:16px; } } </style> </head> <body> <div class="container"> <!-- ========================= LOGO ========================== --> <div class="logo-container"> <div class="logo-ring"> <img src="Imagenes/Screenshot_20260813_220411_com_microsoft_copilot_MainActivity.jpg" alt="Logo" onerror="this.style.display='none';" > </div> </div> <!-- ========================= TITULO ========================== --> <h1> 📅 Calculadora de Vacaciones Pro </h1> <p class="subtitulo"> Calcula fechas de vacaciones por días calendario </p> <!-- ========================= FECHA ========================== --> <label for="fechaInicio"> Fecha de inicio </label> <input type="date" id="fechaInicio" > <!-- ========================= ACCIONES ========================== --> <div class="acciones"> <button type="button" class="mini-btn" onclick="ponerHoy()"> Hoy </button> <button type="button" class="mini-btn" onclick="ponerManana()"> Mañana </button> <button type="button" class="mini-btn" onclick="limpiarFormulario()"> Limpiar </button> </div> <!-- ========================= DÍAS ========================== --> <label for="dias"> Días de vacaciones otorgados </label> <input type="number" id="dias" min="1" step="1" placeholder="Ejemplo: 120" > <!-- ========================= BOTÓN CALCULAR ========================== --> <button type="button" class="btn-principal" onclick="calcularVacaciones()"> 🚀 Calcular Vacaciones </button> <!-- ========================= RESULTADOS ========================== --> <div class="resultado" id="resultado"> <div class="card"> <h3> 📅 Fecha de Inicio </h3> <p id="inicio"></p> </div> <div class="card"> <h3> 🏁 Fecha Final </h3> <p id="fin"></p> </div> <div class="card"> <h3> ✅ Total de Días </h3> <p id="total"></p> </div> <div class="card"> <h3> 📆 Años Involucrados </h3> <p id="anio"></p> </div> <!-- ========================= RESUMEN ========================== --> <div class="card resumen"> <h3> 📊 Resumen Ejecutivo </h3> <div class="stats"> <div> <span id="meses"> 0 </span> <small> Meses aprox. </small> </div> <div> <span id="semanas"> 0 </span> <small> Semanas </small> </div> <div> <span id="cruce"> No </span> <small> Cruza Año </small> </div> </div> </div> <!-- ========================= BARRA ========================== --> <div class="timeline"> <div class="progress" id="progress"> </div> </div> </div> <!-- ========================= FOOTER ========================== --> <footer> Sistema compatible con años bisiestos • Versión PRO </footer> </div> <script> /* ===================================== OBTENER FECHA LOCAL ===================================== */ function obtenerFechaLocal(){ const fecha = new Date(); const año = fecha.getFullYear(); const mes = String( fecha.getMonth() + 1 ).padStart(2,"0"); const dia = String( fecha.getDate() ).padStart(2,"0"); return `${año}-${mes}-${dia}`; } /* ===================================== CONVERTIR FECHA INPUT SIN UTC ===================================== */ function crearFecha(fechaTexto){ const partes = fechaTexto.split("-"); return new Date( Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]) ); } /* ===================================== HOY ===================================== */ function ponerHoy(){ document.getElementById( "fechaInicio" ).value = obtenerFechaLocal(); } /* ===================================== MAÑANA ===================================== */ function ponerManana(){ const fecha = new Date(); fecha.setDate( fecha.getDate() + 1 ); const año = fecha.getFullYear(); const mes = String( fecha.getMonth() + 1 ).padStart(2,"0"); const dia = String( fecha.getDate() ).padStart(2,"0"); document.getElementById( "fechaInicio" ).value = `${año}-${mes}-${dia}`; } /* ===================================== LIMPIAR ===================================== */ function limpiarFormulario(){ document.getElementById( "fechaInicio" ).value = ""; document.getElementById( "dias" ).value = ""; document.getElementById( "resultado" ).style.display = "none"; document.getElementById( "progress" ).style.width = "0%"; document.getElementById( "inicio" ).textContent = ""; document.getElementById( "fin" ).textContent = ""; document.getElementById( "total" ).textContent = ""; document.getElementById( "anio" ).textContent = ""; document.getElementById( "meses" ).textContent = "0"; document.getElementById( "semanas" ).textContent = "0"; document.getElementById( "cruce" ).textContent = "No"; } /* ===================================== FORMATEAR FECHA ===================================== */ function formatearFecha(fecha){ return fecha.toLocaleDateString( "es-PA", { weekday:"long", day:"numeric", month:"long", year:"numeric" } ); } /* ===================================== CALCULAR VACACIONES ===================================== */ function calcularVacaciones(){ const fechaInput = document.getElementById( "fechaInicio" ).value; const diasTexto = document.getElementById( "dias" ).value.trim(); /* Validación */ if(!fechaInput){ alert( "Seleccione una fecha de inicio." ); return; } if( !diasTexto || !Number.isInteger( Number(diasTexto) ) || Number(diasTexto) <= 0 ){ alert( "Ingrese una cantidad válida de días." ); return; } const dias = Number(diasTexto); /* Fecha inicial */ const inicio = crearFecha(fechaInput); /* Fecha final */ const fin = new Date(inicio); /* Se resta 1 porque el primer día cuenta. */ fin.setDate( fin.getDate() + dias - 1 ); /* Mostrar fechas */ document.getElementById( "inicio" ).textContent = formatearFecha(inicio); document.getElementById( "fin" ).textContent = formatearFecha(fin); /* Total */ document.getElementById( "total" ).textContent = `${dias} días calendario`; /* ================================= AÑOS INVOLUCRADOS ================================= */ const años = []; for( let año = inicio.getFullYear(); año <= fin.getFullYear(); año++ ){ años.push(año); } document.getElementById( "anio" ).textContent = años.join(" - "); /* ================================= MESES APROXIMADOS ================================= */ const meses = Math.floor(dias / 30); document.getElementById( "meses" ).textContent = meses; /* ================================= SEMANAS ================================= */ const semanas = Math.floor(dias / 7); document.getElementById( "semanas" ).textContent = semanas; /* ================================= CRUCE DE AÑO ================================= */ const cruzaAño = inicio.getFullYear() !== fin.getFullYear(); document.getElementById( "cruce" ).textContent = cruzaAño ? "Sí" : "No"; /* ================================= MOSTRAR RESULTADO ================================= */ document.getElementById( "resultado" ).style.display = "block"; /* ================================= ANIMACIÓN DE PROGRESO ================================= */ const progress = document.getElementById( "progress" ); progress.style.width = "0%"; setTimeout(()=>{ progress.style.width = "100%"; },200); } /* ===================================== INICIO AUTOMÁTICO ===================================== */ window.addEventListener( "load", function(){ ponerManana(); } ); /* ===================================== EFECTO RGB ===================================== */ window.addEventListener( "load", function(){ const colores = [ "#ff0000", "#ff7b00", "#ffff00", "#00ff00", "#00ffff", "#0066ff", "#8a2be2", "#ff1493" ]; setInterval(function(){ const aro = document.querySelector( ".logo-ring" ); const color = colores[ Math.floor( Math.random() * colores.length ) ]; aro.style.filter = `drop-shadow(0 0 12px ${color}) drop-shadow(0 0 25px ${color})`; },700); } ); </script> </body> </html>
