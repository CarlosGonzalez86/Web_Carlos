<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Vacaciones Pro</title><style> *{box-sizing:border-box;font-family:Segoe UI;margin:0}body{min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#001f54,#0048ff,#0f172a);color:white}.box{width:100%;max-width:700px;padding:30px;border-radius:22px;background:#ffffff1c;backdrop-filter:blur(15px);box-shadow:0 15px 30px #0005}.logo{text-align:center;margin-bottom:20px}.logo img{width:120px;height:120px;border-radius:50%;border:5px solid #08f;animation:g 4s linear infinite}@keyframes g{to{transform:rotate(360deg)}}h1{text-align:center;font-size:27px}.sub{text-align:center;color:#dbeafe;margin:8px 0 22px}label{display:block;margin:12px 0 6px;font-weight:bold}input{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px}.acts{display:flex;gap:8px;margin-top:8px}button{border:0;border-radius:10px;padding:12px;cursor:pointer;color:white;font-weight:bold}.mini{flex:1;background:#1e40af}.main{width:100%;margin-top:20px;background:linear-gradient(90deg,#00b2ff,#005cff);font-size:16px}.res{display:none;margin-top:20px}.card{background:white;color:#374151;border-left:5px solid #0570ff;border-radius:12px;padding:14px;margin:10px 0}.card h3{color:#0570ff;margin-bottom:5px}.card p{font-size:17px;font-weight:bold}.sum{background:linear-gradient(135deg,#0570ff,#00a2ff);color:white;border:0}.sum h3{color:white}.stats{display:flex;justify-content:space-around;text-align:center;margin-top:15px}.stats span{display:block;font-size:27px;font-weight:bold}.bar{height:15px;background:#ccd3dc;border-radius:20px;overflow:hidden;margin-top:18px}.prog{height:100%;width:0;background:linear-gradient(90deg,#00b2ff,#004cff);transition:1.5s}footer{text-align:center;margin-top:18px;font-size:12px;color:#dbeafe}@media(max-width:500px){.box{padding:20px}.acts,.stats{flex-direction:column}.mini{width:100%}h1{font-size:22px}} </style></head><body><div class="box"><div class="logo"><img src="Imagenes/Screenshot_20260813_220411_com_microsoft_copilot_MainActivity.jpg" alt="Logo"></div><h1>📅 Calculadora de Vacaciones Pro</h1><p class="sub">Calcula fechas de vacaciones por días calendario</p><label>Fecha de inicio</label><input type="date" id="f"><div class="acts"><button class="mini" onclick="hoy()">Hoy</button><button class="mini" onclick="man()">Mañana</button><button class="mini" onclick="lim()">Limpiar</button></div><label>Días de vacaciones otorgados</label><input type="number" id="d" min="1" placeholder="Ejemplo: 120"><button class="main" onclick="calc()">🚀 Calcular Vacaciones</button><div class="res" id="r"><div class="card"><h3>📅 Fecha de Inicio</h3><p id="i"></p></div><div class="card"><h3>🏁 Fecha Final</h3><p id="fn"></p></div><div class="card"><h3>✅ Total de Días</h3><p id="t"></p></div><div class="card"><h3>📆 Años Involucrados</h3><p id="a"></p></div><div class="card sum"><h3>📊 Resumen Ejecutivo</h3><div class="stats"><div><span id="m">0</span>Meses</div><div><span id="s">0</span>Semanas</div><div><span id="c">No</span>Cruza Año</div></div></div><div class="bar"><div class="prog" id="p"></div></div></div><footer>Sistema compatible con años bisiestos • Versión PRO</footer></div><script> const $=x=>document.getElementById(x),fmt=x=>x.toLocaleDateString("es-PA",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),dt=x=>{let[a,m,d]=x.split("-");return new Date(a,m-1,d)},iso=x=>{let y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,"0"),d=String(x.getDate()).padStart(2,"0");return`${y}-${m}-${d}`};function hoy(){$("f").value=iso(new Date())}function man(){let x=new Date;x.setDate(x.getDate()+1);$("f").value=iso(x)}function lim(){["f","d"].forEach(x=>$(x).value="");$("r").style.display="none";$("p").style.width="0"}function calc(){if(!$("f").value||!$("d").value||$("d").value<1)return alert("Ingrese una fecha y cantidad válida");let x=dt($("f").value),n=+ $("d").value,y=new Date(x);y.setDate(y.getDate()+n-1);$("i").textContent=fmt(x);$("fn").textContent=fmt(y);$("t").textContent=n+" días calendario";let a=[];for(let z=x.getFullYear();z<=y.getFullYear();z++)a.push(z);$("a").textContent=a.join(" - ");$("m").textContent=Math.floor(n/30);$("s").textContent=Math.floor(n/7);$("c").textContent=x.getFullYear()!=y.getFullYear()?"Sí":"No";$("r").style.display="block";setTimeout(()=>$("p").style.width="100%",100)}man(); </script></body></html>
